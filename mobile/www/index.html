<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FurGuardian</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f7f6f2;
        color: #1f5c4a;
        font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .paw {
        width: 46px; height: 46px;
        border: 2px solid #1f5c4a;
        border-radius: 50%;
        display: grid; place-items: center;
        font-size: 20px;
      }
      .name { font-size: 15px; letter-spacing: 0.12em; }
      .tip { font-size: 12px; color: #6b6f76; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="paw">🐾</div>
    <div class="name">FURGUARDIAN</div>
    <div class="tip">正在连接服务…</div>
  </body>
</html>
