server:
  port: 8080

spring:
  application:
    name: fur-guardian
  # local profile 激活后自动加载同目录的 application-local.yml（已被 .gitignore 排除，不入库）
  # 该文件缺失时不会报错，Spring 会沿用本文件里的占位符值
  profiles:
    active: local

  # ======================== 定时任务线程池 ========================
  # 默认调度器只有 1 个线程，邮件/周报/Tip/向量入库会互相排队；
  # 单个任务卡住（如 SMTP 超时）会连带拖住其它任务。
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: fg-sched-

  # ======================== 文件上传 ========================
  # 头像上传限制：与 OssStorageService 中的校验保持一致
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ======================== 邮件提醒（SMTP）====================
  # 未配置时提醒邮件任务自动跳过，不影响启动。
  # 真实账号写在 application-local.yml（不入库）或环境变量；
  # QQ / 163 邮箱必须使用「SMTP 授权码」，不是登录密码。
  # mail:
  #   host: smtp.qq.com
  #   port: 465
  #   username: your@qq.com
  #   password: your-smtp-authorization-code
  #   default-encoding: UTF-8
  #   properties:
  #     mail.smtp.auth: true
  #     mail.smtp.ssl.enable: true

  # ======================== MySQL ========================
  datasource:
    # characterEncoding 必须写 UTF-8：Connector/J 9.x 不认识 utf8mb4 这个名称，
    # 传 utf8mb4 会在 getConnection() 抛 UnsupportedEncodingException；服务端仍落到 utf8mb4
    url: jdbc:mysql://localhost:3306/fur_guardian?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: your-local-password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ======================== Redis ========================
  data:
    redis:
      host: localhost
      port: 6379
      # password: your-local-redis-password

# ======================== MyBatis-Plus ========================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.purr.furguardian.biz.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ======================== LangChain4j - DashScope (通义千问) ========================
# 以下为占位符。真实 Key 写在 application-local.yml（不入库），由 local profile 覆盖。
# 备选：队友不建 local 文件时，可用环境变量注入 DASHSCOPE_API_KEY 后启动。
langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: your-dashscope-api-key
        model-name: qwen-plus
      embedding-model:
        api-key: your-dashscope-api-key
        model-name: text-embedding-v3
    # 前缀为扁平结构：真实 @ConfigurationProperties(prefix="langchain4j.community.redis")
    # 不要再套一层 embedding-store，否则 host/port 绑定不到，启动即 NPE
    redis:
      host: localhost
      port: 6379
      # password: your-local-redis-password
      index-name: fur-guardian-embeddings
      dimension: 1024
      # 必须显式声明：RedisEmbeddingStore 回读时会按 metadataConfig 的 key 过滤，
      # 未声明的 key 会被丢弃，导致检索结果里 metadata.getString("docId") 恒为 null，
      # 向量检索永远命中 0 条并静默降级到 SQL。
      metadata-keys:
        - docId
        - species
        - lifeStage
        - severity

# ======================== 高德开放平台 ========================
# 以下为占位符。真实 Key 写在 application-local.yml（不入库），由 local profile 覆盖。
# Key 类型必须选「Web 服务」，用于后端周边 POI 与步行路线查询
fg:
  # 管理员账号只能由数据库预置，该用户名禁止注册；登录后用户名命中即拥有管理权限
  admin:
    username: admin
  amap:
    web-key: ""
  # 心知天气 HyperData v3，用于遛弯提醒的当日天气与适宜度
  # 真实 Key 写在 application-local.yml（不入库）；免费版即可调用逐日预报
  weather:
    key: ""
    base-url: https://api.seniverse.com

# ======================== 提醒邮件 ========================
furguardian:
  mail:
    # 邮件里的「去打卡」链接指向的前端地址
    app-url: ${FG_APP_URL:http://localhost:5173}
    # 扫描到点提醒的频率：默认每 5 分钟
    scan-cron: "0 */5 * * * *"

# ======================== 阿里云 OSS ========================
# 仅用于宠物头像上传；endpoint/bucket 不是密钥，可入库。
# AccessKey 必须写在 application-local.yml（不入库）或环境变量。
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket: fur-guardian
    access-key-id: your-oss-access-key-id
    access-key-secret: your-oss-access-key-secret
    # 可选：CDN/自定义域名。留空时返回 https://{bucket}.{endpoint}/{objectKey}
    public-base-url: ""

# ======================== SpringDoc OpenAPI ========================
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ======================== Logging ========================
logging:
  level:
    com.purr.furguardian: debug
    org.springframework: info
