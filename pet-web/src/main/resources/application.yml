server:
  port: 8080

spring:
  application:
    name: fur-guardian
  # local profile 激活后自动加载同目录的 application-local.yml（已被 .gitignore 排除，不入库）
  # 该文件缺失时不会报错，Spring 会沿用本文件里的占位符值
  profiles:
    active: local

  # ======================== MySQL ========================
  datasource:
    url: jdbc:mysql://localhost:3306/fur_guardian?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: your-local-password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ======================== Redis ========================
  data:
    redis:
      host: localhost
      port: 6379
      # password: your-local-redis-password

# ======================== MyBatis-Plus ========================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.purr.furguardian.biz.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ======================== LangChain4j - DashScope (通义千问) ========================
# 以下为占位符。真实 Key 写在 application-local.yml（不入库），由 local profile 覆盖。
# 备选：队友不建 local 文件时，可用环境变量注入 DASHSCOPE_API_KEY 后启动。
langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: your-dashscope-api-key
        model-name: qwen-plus
      embedding-model:
        api-key: your-dashscope-api-key
        model-name: text-embedding-v3
    # 前缀为扁平结构：真实 @ConfigurationProperties(prefix="langchain4j.community.redis")
    # 不要再套一层 embedding-store，否则 host/port 绑定不到，启动即 NPE
    redis:
      host: localhost
      port: 6379
      # password: your-local-redis-password
      index-name: fur-guardian-embeddings
      dimension: 1024

# ======================== SpringDoc OpenAPI ========================
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ======================== Logging ========================
logging:
  level:
    com.purr.furguardian: debug
    org.springframework: info
