# ============================================================
# FurGuardian 中间件编排：MySQL 8.0 + Redis 8（含 Query Engine）
# 用法见 deploy/云服务器部署说明.md
#
# 两条硬约束：
#   1. Redis 必须 >= 8.0 —— Ubuntu 24.04 apt 里的 redis-server 是 7.0，
#      没有 FT.CREATE / 向量检索，所以这里用官方镜像，不要 apt 装。
#   2. 初始化 SQL 只会在 mysql-data 卷为空时执行一次。
#      SQL 改了要重新初始化，用 `docker compose down -v`（会删数据）。
# ============================================================

name: furguardian

services:
  mysql:
    image: mysql:8.0
    container_name: pet-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fur_guardian}
      MYSQL_USER: ${MYSQL_USER:-fur}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 允许 root 远程登录（仅当 BIND_ADDR=0.0.0.0 或走 SSH 隧道时才用得上）
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - pet-mysql-data:/var/lib/mysql
      # 关键：不要挂载整个 ./sql 目录！
      # 入口脚本按容器内文件名排序执行，knowledge_seed.sql 会排在 schema.sql 前面导致建表失败。
      # 这里显式挂成 01/02/03/04，顺序才是确定的。
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/knowledge_seed.sql:/docker-entrypoint-initdb.d/03-knowledge_seed.sql:ro
      # WSAVA 语料扩充（765 条），由 sql/build-wsava-seed.mjs 生成；按 title 幂等 DELETE，可反复执行
      - ./sql/knowledge_seed_wsava.sql:/docker-entrypoint-initdb.d/04-knowledge_seed_wsava.sql:ro
      # MSD 兽医手册语料扩充（495 条），由 sql/build-msd-seed.mjs 生成；同样按 title 幂等
      - ./sql/knowledge_seed_msd.sql:/docker-entrypoint-initdb.d/05-knowledge_seed_msd.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # 必须 8.x（>=8.0 才内置 Query Engine）。
    # 坑：阿里云 ACR 加速器的缓存停在 Redis 6.2.6，redis:8 / 8.10.2 都会 404；
    # 实测从 daocloud 公共镜像拉到的 latest = 8.10.2，所以这里用完整镜像名，
    # 起好后用 `redis-cli INFO server | grep redis_version` 确认 >= 8.0。
    image: docker.m.daocloud.io/library/redis:latest
    container_name: pet-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --tcp-keepalive
      - "60"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - pet-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pet-mysql-data:
  pet-redis-data:
